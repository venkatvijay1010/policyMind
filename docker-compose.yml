services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: policymind-app
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/policymind.db
      - DATABASE_SYNC_URL=sqlite:////app/data/policymind.db
      - LLM_PROVIDER=ollama
      # Ollama runs on the Windows/macOS/Linux host, not in this container.
      - LLM_BASE_URL=http://host.docker.internal:11434/v1
      - LLM_API_KEY=ollama
      - CHAT_MODEL=qwen2.5:7b
      - EMBEDDING_MODEL=nomic-embed-text
      - EMBEDDING_DIMENSION=768
      - APP_ENV=development
      - LOG_LEVEL=INFO
      - VECTOR_BACKEND=${VECTOR_BACKEND:-database}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - BM25_BACKEND=${BM25_BACKEND:-memory}
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL:-http://elasticsearch:9200}
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Only used when VECTOR_BACKEND=qdrant.
  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: policymind-qdrant
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  # Only used when BM25_BACKEND=elasticsearch. Security is off for local use only.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: policymind-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  # Optional: docker compose --profile observability up
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [observability]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/alerts.yml:/etc/prometheus/alerts.yml:ro

  grafana:
    image: grafana/grafana:11.3.0
    profiles: [observability]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  qdrant_storage:
  es_data:
