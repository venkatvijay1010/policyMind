services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: policymind-app
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/policymind.db
      - DATABASE_SYNC_URL=sqlite:////app/data/policymind.db
      - LLM_PROVIDER=ollama
      # Ollama runs on the Windows/macOS/Linux host, not in this container.
      - LLM_BASE_URL=http://host.docker.internal:11434/v1
      - LLM_API_KEY=ollama
      - CHAT_MODEL=qwen2.5:7b
      - EMBEDDING_MODEL=nomic-embed-text
      - EMBEDDING_DIMENSION=768
      - APP_ENV=development
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
