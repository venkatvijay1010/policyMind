groups:
  - name: policymind
    rules:
      - alert: HighP95Latency
        expr: histogram_quantile(0.95, sum(rate(pm_request_seconds_bucket[5m])) by (le)) > 30
        for: 10m
        annotations:
          summary: P95 query latency above 30s for 10 minutes
      - alert: HighFailureRate
        expr: sum(rate(pm_failures_total[5m])) / clamp_min(sum(rate(pm_request_seconds_count[5m])) + sum(rate(pm_failures_total[5m])), 0.001) > 0.02
        for: 10m
        annotations:
          summary: More than 2% of queries are failing
